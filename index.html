<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MEMOR tiles — Keramik plita katalogi</title>
<meta name="theme-color" content="#18181a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MEMOR">
<link rel="apple-touch-icon" href="icon192.png">
<link rel="icon" href="icon192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--ink:#18181a;--soft:#82817d;--line:#e4e2de;--gold:#be9e70;--panel:#f7f6f4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141413;--ink:#ecebe7;--soft:#9b9994;--line:#2e2d2a;--panel:#1d1d1b}}
:root[data-theme="dark"]{--bg:#141413;--ink:#ecebe7;--soft:#9b9994;--line:#2e2d2a;--panel:#1d1d1b}
.thm{width:40px;height:40px;border:1px solid var(--line);background:transparent;
     color:var(--ink);font-size:16px;line-height:1;transition:all .22s;flex:none}
.thm:hover{border-color:var(--ink)}
html{transition:none}
body,.bar,.card img,.chip,#q{transition:background-color .35s,color .35s,border-color .35s}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Archivo,Arial,sans-serif;
     line-height:1.5;overflow-x:hidden}
img{display:block;max-width:100%}
button{font:inherit;cursor:pointer;color:inherit}
.serif{font-family:"Instrument Serif",Georgia,serif;font-weight:400}

/* ── muqova: parallaks ── */
.hero{position:relative;height:96vh;min-height:520px;overflow:hidden;background:#111}
.hero .bgwrap{position:absolute;inset:-8% 0;height:116%;will-change:transform}
.hero .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
          opacity:0;transform:scale(1.04);transition:opacity 1.8s ease}
.hero .bg.on{opacity:.9;animation:kb 13s ease-out forwards}
@keyframes kb{from{transform:scale(1.04)}to{transform:scale(1.13)}}
.dots{position:absolute;right:24px;bottom:26px;display:flex;gap:7px;z-index:3}
.dots b{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.4);
        cursor:pointer;transition:all .3s}
.dots b.on{background:#fff;width:20px;border-radius:4px}
.hero .veil{position:absolute;inset:0;
  background:linear-gradient(to bottom,rgba(10,10,12,.42) 0%,rgba(10,10,12,0) 28%,
             rgba(10,10,12,.30) 52%,rgba(10,10,12,.78) 78%,rgba(10,10,12,.92) 100%)}
.hero .in{position:absolute;inset:auto 0 0 0;padding:0 24px 54px;max-width:1240px;
          margin:0 auto;width:100%}
.hero .lg{width:clamp(260px,32vw,440px);filter:brightness(0) invert(1);
          opacity:0;transform:translateY(20px)}
.hero .sub{margin:26px 0 0;color:#d9d6d0;font-size:15px;letter-spacing:.06em;
           opacity:0;transform:translateY(20px)}
.hero .rule{height:1px;background:var(--gold);margin-top:22px;transform:scaleX(0);
            transform-origin:left}
.go{position:absolute;left:50%;bottom:22px;color:#fff;opacity:.75;font-size:22px;
    animation:bob 2.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,9px)}}
.hero.on .lg,.hero.on .sub{opacity:1;transform:none;
  transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1)}
.hero.on .sub{transition-delay:.18s}
.hero.on .rule{transform:scaleX(1);transition:transform 1.1s cubic-bezier(.2,.7,.2,1) .3s}

/* ── boshqaruv ── */
.bar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);
     backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:11px 24px;
     transition:box-shadow .3s}
.bar.stuck{box-shadow:0 6px 24px rgba(0,0,0,.07)}
.bar .in{max-width:1240px;margin:0 auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
#q{flex:1;min-width:180px;padding:12px 14px;font:inherit;border:1px solid var(--line);
   background:var(--panel);color:var(--ink);transition:border-color .2s}
#q:focus{outline:none;border-color:var(--ink)}
.chip{padding:10px 15px;border:1px solid var(--line);background:transparent;color:var(--ink);
      font-size:14px;font-weight:500;transition:all .22s cubic-bezier(.2,.7,.2,1)}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.cnt{color:var(--soft);font-size:14px}

/* ── setka ── */
.wrap{max-width:1240px;margin:0 auto;padding:34px 24px 90px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:26px 18px;
      align-items:end}
.card{background:none;border:0;padding:0;text-align:left;color:var(--ink);
      opacity:0;transform:translateY(22px)}
.card.in{opacity:1;transform:none;
         transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1)}
.card .ph{display:flex;align-items:flex-end;justify-content:center;height:236px;
          transition:transform .4s cubic-bezier(.2,.7,.2,1)}
.card img{border:1px solid var(--line);max-height:236px;width:auto;
          transition:box-shadow .4s,border-color .3s}
.card:hover .ph{transform:translateY(-9px)}
.card:hover img{box-shadow:0 18px 34px rgba(0,0,0,.18);border-color:var(--gold)}
.card b{display:block;font-size:13px;font-weight:600;margin-top:11px;
        word-break:break-all;color:var(--ink)}
.card span{display:block;font-size:12px;color:var(--soft)}

/* ── mahsulot ── */
.detail{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;
        transform:translateY(24px);opacity:0;pointer-events:none;
        transition:opacity .38s ease,transform .38s cubic-bezier(.2,.7,.2,1)}
.detail.on{opacity:1;transform:none;pointer-events:auto}
.dwrap{max-width:1240px;margin:0 auto;padding:22px 24px 80px}
.back{border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:11px 18px;
      font-weight:600;margin-bottom:20px;transition:all .2s}
.back:hover{background:var(--ink);color:var(--bg)}
.dhead{display:flex;justify-content:space-between;align-items:baseline;gap:16px;
       border-bottom:1.5px solid var(--ink);padding-bottom:10px;flex-wrap:wrap}
.dhead h2{margin:0;font-size:clamp(30px,5.4vw,58px);line-height:1}
.dhead .sz{font-size:17px;font-weight:600}
.dmain{display:grid;grid-template-columns:1.7fr 1fr;gap:26px;margin-top:22px}
@media(max-width:760px){.dmain{grid-template-columns:1fr}}
.dmain img{border:1px solid var(--line);width:100%}
.rise{opacity:0;transform:translateY(18px)}
.detail.on .rise{opacity:1;transform:none;
  transition:opacity .5s ease .1s,transform .5s cubic-bezier(.2,.7,.2,1) .1s}
.detail.on .rise:nth-child(2){transition-delay:.18s}
dl{margin:18px 0 0}
dl div{display:flex;justify-content:space-between;gap:14px;padding:10px 0;
       border-bottom:1px solid var(--line)}
dt{color:var(--soft);font-size:14px}
dd{margin:0;font-weight:600;font-size:14.5px;text-align:right}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:11px;margin-top:24px}
.thumbs img{border:1px solid var(--line);cursor:zoom-in;transition:transform .35s,box-shadow .35s}
.thumbs img:hover{transform:scale(1.03);box-shadow:0 12px 26px rgba(0,0,0,.16)}
.lbl{font-size:12px;font-weight:600;color:var(--soft);letter-spacing:.14em;
     border-top:1.5px solid var(--ink);padding-top:12px;margin-top:30px}

/* ── kattalashtirish ── */
#lb{position:fixed;inset:0;background:rgba(12,12,14,0);z-index:60;display:none;
    align-items:center;justify-content:center;flex-direction:column;
    transition:background .3s}
#lb.on{display:flex}#lb.vis{background:rgba(12,12,14,.97)}
#lb img{max-width:94vw;max-height:84vh;object-fit:contain;opacity:0;transform:scale(.94);
        transition:opacity .34s ease,transform .34s cubic-bezier(.2,.7,.2,1);cursor:zoom-in}
#lb.vis img{opacity:1;transform:none}
#lb img.zoom{cursor:zoom-out;transform:scale(1.85)}
#lb .nav{position:absolute;top:50%;margin-top:-32px;font-size:34px;color:#fff;background:none;
         border:0;padding:16px 22px;opacity:.7;transition:opacity .2s}
#lb .nav:hover{opacity:1}
#lb .pv{left:2px}#lb .nx{right:2px}
#lb .x{position:absolute;top:10px;right:16px;font-size:34px;color:#fff;background:none;border:0}
#lb .cnt2{color:#bdbab5;font-size:13px;margin-top:14px}
/* ── tanlash ── */
.star{position:absolute;top:6px;right:6px;z-index:3;width:30px;height:30px;border:0;
      background:rgba(255,255,255,.88);color:#b9b6b0;font-size:16px;line-height:1;
      opacity:0;transform:scale(.85);transition:all .2s;border-radius:50%}
.card{position:relative}
.card:hover .star,.star.on{opacity:1;transform:none}
.star.on{color:var(--gold);background:rgba(255,255,255,.96)}
@media(hover:none){.star{opacity:1;transform:none}}
.fab{position:fixed;right:20px;bottom:20px;z-index:45;background:var(--ink);color:var(--bg);
     border:0;padding:14px 20px;font-weight:600;box-shadow:0 12px 30px rgba(0,0,0,.24);
     transform:translateY(90px);transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.fab.on{transform:none}
.panel{position:fixed;inset:0;z-index:55;background:rgba(12,12,14,.5);display:none}
.panel.on{display:block}
.panel .in{position:absolute;right:0;top:0;bottom:0;width:min(420px,100%);background:var(--bg);
  padding:22px;overflow-y:auto;transform:translateX(100%);transition:transform .34s cubic-bezier(.2,.7,.2,1)}
.panel.vis .in{transform:none}
.panel h3{margin:0 0 4px;font-size:24px}
.pclose{position:absolute;top:14px;right:16px;background:none;border:0;color:var(--soft);
  font-size:30px;line-height:1;padding:4px 8px;transition:color .2s}
.pclose:hover{color:var(--ink)}
.sel{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.sel img{width:48px;height:96px;object-fit:cover;border:1px solid var(--line);flex:none}
.sel .info{flex:1;min-width:0}
.sel b{font-size:13.5px;display:block;word-break:break-all}
.sel .m{font-size:12px;color:var(--soft);line-height:1.6}
.sel .qty{display:flex;gap:6px;align-items:center;margin-top:7px}
.sel .qty input{width:74px;padding:6px 8px;font:inherit;font-size:12.5px;
  border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.sel .qty .o{font-size:12px;color:var(--gold);font-weight:600}
.sel .del{background:none;border:0;color:var(--soft);font-size:19px;align-self:flex-start}
.tot{margin-top:14px;padding-top:12px;border-top:1.5px solid var(--ink);font-size:13.5px}
.prow{display:flex;gap:8px;margin-top:18px}
.prow button{flex:1;padding:12px;border:1px solid var(--ink);background:var(--ink);
  color:var(--bg);font-weight:600}
.prow button.alt{background:transparent;color:var(--ink)}
#out{width:100%;margin-top:14px;min-height:130px;padding:10px;font-family:ui-monospace,monospace;
     font-size:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);display:none}

/* ── hisoblagich ── */
.calc{margin-top:28px;border:1px solid var(--line);padding:20px}
.calc h4{margin:0 0 14px;font-size:12px;font-weight:600;letter-spacing:.14em;color:var(--soft)}
.calc .dims{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.calc label{display:block;font-size:11.5px;color:var(--soft);margin-bottom:4px}
.calc input{width:92px;padding:9px 10px;font:inherit;border:1px solid var(--line);
  background:var(--bg);color:var(--ink)}
.calc input:focus{outline:none;border-color:var(--ink)}
.calc .opts{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;margin-bottom:14px;
  padding-bottom:14px;border-bottom:1px solid var(--line)}
.calc .opts label{display:flex;gap:6px;align-items:center;color:var(--ink);font-size:13px;
  margin:0;cursor:pointer}
.calc table{width:100%;border-collapse:collapse;font-size:13px}
.calc td{padding:8px 0;border-bottom:1px solid var(--line)}
.calc td.n{text-align:right;font-variant-numeric:tabular-nums}
.calc td.p{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.calc tr.tot td{border-bottom:0;border-top:1.5px solid var(--ink);font-weight:600;
  padding-top:11px;font-size:14px}
.calc .note{font-size:11.5px;color:var(--soft);margin-top:10px;line-height:1.6}
.calc .add{margin-top:14px;padding:11px 18px;border:1px solid var(--ink);background:var(--ink);
  color:var(--bg);font-weight:600}
.calc .add.done{background:var(--gold);border-color:var(--gold)}

.inst{position:fixed;left:14px;right:14px;bottom:14px;z-index:50;background:var(--ink);
  color:var(--bg);padding:14px 16px;display:none;align-items:center;gap:12px;
  box-shadow:0 14px 34px rgba(0,0,0,.3);transform:translateY(120%);
  transition:transform .4s cubic-bezier(.2,.7,.2,1)}
.inst.on{display:flex}.inst.vis{transform:none}
.inst .t{flex:1;font-size:13.5px;line-height:1.5}
.inst b{font-weight:600}
.inst button{background:var(--bg);color:var(--ink);border:0;padding:9px 14px;font-weight:600;
  font-size:13px;white-space:nowrap}
.inst .cl{background:none;color:var(--bg);opacity:.7;padding:6px 4px;font-size:20px}
@media(min-width:820px){.inst{left:auto;right:20px;width:400px;bottom:80px}}

.foot{border-top:1px solid var(--line);padding:26px 24px;color:var(--soft);font-size:13px}
.foot .in{max-width:1240px;margin:0 auto;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.hero .bg{transform:scale(1.02)}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.08)}}
</style></head><body>

<script>
const D=window.__D;
const grid=document.getElementById('grid'),det=document.getElementById('detail'),
      dw=document.getElementById('dwrap'),q=document.getElementById('q'),
      lb=document.getElementById('lb'),lbi=lb.querySelector('img'),
      lbc=lb.querySelector('.cnt2'),hero=document.getElementById('hero');
let fSize=null,fSirt=null,cur=null,gal=[],gi=0;

/* ── kunduzgi / kechki rejim ── */
const TKEY='memor_rejim';
function setTheme(t){
  if(t) document.documentElement.setAttribute('data-theme',t);
  else document.documentElement.removeAttribute('data-theme');
  const b=document.getElementById('thm');
  const dark = t==='dark' || (!t && matchMedia('(prefers-color-scheme:dark)').matches);
  if(b){b.textContent = dark ? '☀' : '☾';
        b.title = dark ? 'Kunduzgi rejim' : 'Kechki rejim';}
}
let THEME=null;
try{THEME=localStorage.getItem(TKEY);}catch(e){}
setTheme(THEME);
document.getElementById('thm').onclick=()=>{
  const dark = THEME==='dark' ||
    (!THEME && matchMedia('(prefers-color-scheme:dark)').matches);
  THEME = dark ? 'light' : 'dark';
  try{localStorage.setItem(TKEY,THEME);}catch(e){}
  setTheme(THEME);
};

/* ── muqova rasmlari almashinuvi ── */
(function(){
  const bgs=[...document.querySelectorAll('.hero .bg')];
  if(bgs.length<2){if(bgs[0])bgs[0].classList.add('on');return;}
  const dots=document.getElementById('dots');
  let i=0,timer=null;
  bgs.forEach((_,k)=>{const b=document.createElement('b');
    b.onclick=()=>{go(k);restart();};dots.appendChild(b);});
  function go(k){
    bgs[i].classList.remove('on');
    i=(k+bgs.length)%bgs.length;
    const el=bgs[i];
    el.style.animation='none';void el.offsetWidth;el.style.animation='';
    el.classList.add('on');
    [...dots.children].forEach((d,n)=>d.classList.toggle('on',n===i));
  }
  function restart(){clearInterval(timer);timer=setInterval(()=>go(i+1),7000);}
  bgs[0].classList.add('on');dots.children[0].classList.add('on');
  restart();
  document.addEventListener('visibilitychange',()=>
    document.hidden?clearInterval(timer):restart());
})();

requestAnimationFrame(()=>hero.classList.add('on'));
addEventListener('scroll',()=>{
  const y=scrollY;
  document.getElementById('hbg').style.transform='translateY('+(y*0.28)+'px)';
  document.getElementById('bar').classList.toggle('stuck',y>window.innerHeight*0.9);
},{passive:true});

const io=new IntersectionObserver(es=>es.forEach(e=>{
  if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}
}),{rootMargin:'0px 0px -60px 0px'});

function uniq(f){return [...new Set(D.map(f))].sort();}
function chips(host,vals,get,set){
  host.innerHTML='';
  vals.forEach(v=>{const b=document.createElement('button');
    b.className='chip';b.textContent=v;b.setAttribute('aria-pressed',String(get()===v));
    b.onclick=()=>{set(get()===v?null:v);render();};host.appendChild(b);});
}
function shown(){
  const s=q.value.trim().toLowerCase();
  return D.filter(d=>(!fSize||d.qisqa===fSize)&&(!fSirt||d.sirt===fSirt)&&
                     (!s||d.kod.toLowerCase().includes(s)));
}
function render(){
  chips(document.getElementById('fSize'),uniq(d=>d.qisqa),()=>fSize,v=>fSize=v);
  chips(document.getElementById('fSirt'),uniq(d=>d.sirt),()=>fSirt,v=>fSirt=v);
  const old=new Map([...grid.children].map(el=>[el.dataset.id,el.getBoundingClientRect()]));
  const r=shown();
  document.getElementById('cnt').textContent=r.length+' ta';
  grid.innerHTML='';
  r.forEach((d,n)=>{
    const b=document.createElement('button');
    b.className='card';b.dataset.id=d.id;
    b.innerHTML='<div class="ph"><img src="'+d.menu+'" alt="'+d.kod+'" loading="lazy"></div>'+
      '<b>'+d.kod+'</b><span>'+d.qisqa+'</span><span>'+d.sirt+'</span>';
    const st=document.createElement('button');
    st.className='star'+(SEL.has(d.id)?' on':'');st.textContent='★';
    st.title='Tanlash';st.onclick=e=>{e.stopPropagation();toggle(d.id);st.classList.toggle('on');};
    b.appendChild(st);
    b.onclick=()=>open_(d.id);
    grid.appendChild(b);
    if(old.has(String(d.id))){            // FLIP: joyidan joyiga silliq ko'chish
      const a=old.get(String(d.id)),bb=b.getBoundingClientRect();
      const dx=a.left-bb.left,dy=a.top-bb.top;
      if(dx||dy){b.classList.add('in');b.style.transform=`translate(${dx}px,${dy}px)`;
        requestAnimationFrame(()=>{b.style.transition='transform .45s cubic-bezier(.2,.7,.2,1)';
          b.style.transform='';});}
    } else {
      b.style.transitionDelay=(Math.min(n,11)*34)+'ms';
      io.observe(b);
      setTimeout(()=>b.classList.add('in'),1400);
    }
  });
}
function row(k,v){return '<div><dt>'+k+'</dt><dd>'+v+'</dd></div>';}
function open_(id,nohash){
  cur=D.find(x=>x.id===id);gal=cur.imgs;
  if(!nohash&&location.hash!=='#'+encodeURIComponent(cur.kod))
    history.pushState(null,'','#'+encodeURIComponent(cur.kod));
  const rest=cur.imgs.slice(2).map((im,i)=>
    '<img src="'+im.s+'" data-i="'+(i+2)+'" alt="" loading="lazy">').join('');
  dw.innerHTML='<button class="back">&larr; Menyuga qaytish</button>'+
   '<div class="dhead"><h2 class="serif">'+cur.kod+'</h2><span class="sz">'+cur.olcham+'</span></div>'+
   '<div class="dmain"><div class="rise"><img src="'+(cur.imgs[1]?cur.imgs[1].b:cur.imgs[0].b)+
     '" data-i="1" alt=""></div>'+
   '<div class="rise"><img src="'+cur.imgs[0].s+'" data-i="0" alt=""><dl>'+
     (cur.spec?cur.spec.map(p=>row(p[0],p[1])).join(''):
       row("O'lcham",cur.olcham)+row("Sirt",cur.sirt)+row("Bitta plita",cur.maydon)+
       row("1 m² uchun",cur.dona)+
       (cur.juft.length?row("Kombinatsiyada",cur.juft.join(", ")):''))+
   '</dl></div></div>'+
   (rest?'<p class="lbl">BOSHQA KO\'RINISHLAR</p><div class="thumbs">'+rest+'</div>':'')+
   calcHTML(cur);
  det.classList.add('on');document.body.style.overflow='hidden';
  dw.querySelector('.back').onclick=()=>close_();
  bindCalc(cur);
  dw.querySelectorAll('img[data-i]').forEach(el=>{el.style.cursor='zoom-in';
    el.onclick=()=>show(+el.dataset.i);});
  det.scrollTop=0;
}
function close_(nohash){det.classList.remove('on');document.body.style.overflow='';
  if(!nohash&&location.hash)history.pushState(null,'',location.pathname+location.search);}
function show(i){gi=(i+gal.length)%gal.length;lbi.classList.remove('zoom');
  lbi.src=gal[gi].b;lbc.textContent=(gi+1)+' / '+gal.length+'  ·  '+cur.kod;
  lb.classList.add('on');requestAnimationFrame(()=>lb.classList.add('vis'));}
function hide(){lb.classList.remove('vis');
  setTimeout(()=>{lb.classList.remove('on');lbi.src='';},300);}
lb.onclick=e=>{
  if(e.target===lbi){lbi.classList.toggle('zoom');return;}
  if(e.target===lb||e.target.classList.contains('x'))hide();
  else if(e.target.classList.contains('pv'))show(gi-1);
  else if(e.target.classList.contains('nx'))show(gi+1);};
document.onkeydown=e=>{
  if(lb.classList.contains('on')){
    if(e.key==='Escape')hide();
    if(e.key==='ArrowLeft')show(gi-1);
    if(e.key==='ArrowRight')show(gi+1);return;}
  if(e.key==='Escape'&&PANEL.classList.contains('on')){closePanel();return;}
  if(e.key==='Escape'&&det.classList.contains('on'))close_();};
/* ── tanlangan plitalar ── */
const KEY='memor_tanlangan';
const QKEY='memor_miqdor', BRANDN="MEMOR tiles";
let SEL=new Set(), QTY={}, CALC={};
try{SEL=new Set(JSON.parse(localStorage.getItem(KEY)||'[]'));}catch(e){}
try{QTY=JSON.parse(localStorage.getItem(QKEY)||'{}');}catch(e){}
function saveSel(){try{localStorage.setItem(KEY,JSON.stringify([...SEL]));
  localStorage.setItem(QKEY,JSON.stringify(QTY));}catch(e){}}
function toggle(id){SEL.has(id)?SEL.delete(id):SEL.add(id);saveSel();paintSel();}
function paintSel(){
  document.getElementById('fabn').textContent=SEL.size;
  document.getElementById('fab').classList.toggle('on',SEL.size>0);
  const host=document.getElementById('sellist');if(!host)return;
  const arr=D.filter(d=>SEL.has(d.id));
  document.getElementById('pcnt').textContent=arr.length+' ta mahsulot';
  host.innerHTML=arr.map(d=>{
    const a=tileArea(d.olcham), m2=QTY[d.id]||'';
    return '<div class="sel"><img src="'+d.menu+'" alt="">'+
      '<div class="info"><b>'+d.kod+'</b>'+
      '<div class="m">'+d.olcham+'<br>'+d.sirt+
        (a?'<br>1 plita — '+a.toFixed(3).replace('.',',')+' m²':'')+'</div>'+
      '<div class="qty"><input type="number" min="0" step="0.1" placeholder="m²" '+
        'inputmode="decimal" data-q="'+d.id+'" value="'+m2+'">'+
        '<span class="o" id="o'+d.id+'"></span></div></div>'+
      '<button class="del" data-del="'+d.id+'" title="Olib tashlash">&times;</button></div>';
  }).join('') || '<p style="color:var(--soft);font-size:13px">Hali hech narsa tanlanmagan.</p>';

  let tm=0, tp=0, lines=[];
  arr.forEach(d=>{
    const a=tileArea(d.olcham), v=parseFloat(QTY[d.id]);
    let pcs=0;
    if(a&&v>0){ pcs=Math.ceil(v*1.05/a); tm+=v; tp+=pcs;
      const o=document.getElementById('o'+d.id);
      if(o)o.textContent='= '+pcs+' dona';
    }
    lines.push(d.kod+'  —  '+d.olcham+'  —  '+d.sirt+
      (pcs?'  —  '+String(v).replace('.',',')+' m²  ('+pcs+' dona)':''));
  });
  const tot=document.getElementById('tot');
  if(tot) tot.innerHTML = tp
    ? 'Jami: <b>'+tp+' dona</b> · '+tm.toFixed(2).replace('.',',')+' m² xona'
    : '';
  document.getElementById('out').value =
    (BRANDN+'\n'+arr.length+" ta mahsulot\n\n"+lines.join('\n')+
     (tp?'\n\nJami: '+tp+' dona · '+tm.toFixed(2).replace('.',',')+' m²':''));
}
document.getElementById('fab').onclick=()=>{
  const p=document.getElementById('panel');p.classList.add('on');
  requestAnimationFrame(()=>p.classList.add('vis'));paintSel();};
const PANEL=document.getElementById('panel');
function closePanel(){
  PANEL.classList.remove('vis');
  setTimeout(()=>PANEL.classList.remove('on'),340);
}
document.getElementById('pclose').onclick=closePanel;
PANEL.onclick=e=>{
  if(e.target===PANEL){closePanel();return;}
  const d=e.target.dataset.del;
  if(d){SEL.delete(+d);delete QTY[d];saveSel();paintSel();
    const st=grid.querySelector('.card[data-id="'+d+'"] .star');
    if(st)st.classList.remove('on');}};
PANEL.addEventListener('input',e=>{
  const id=e.target.dataset.q;
  if(id){QTY[id]=e.target.value;saveSel();
    const d=D.find(x=>String(x.id)===id), a=tileArea(d.olcham), v=parseFloat(e.target.value);
    const o=document.getElementById('o'+id);
    if(o)o.textContent=(a&&v>0)?('= '+Math.ceil(v*1.05/a)+' dona'):'';
    let tm=0,tp=0,lines=[];
    D.filter(x=>SEL.has(x.id)).forEach(x=>{
      const aa=tileArea(x.olcham), vv=parseFloat(QTY[x.id]); let p=0;
      if(aa&&vv>0){p=Math.ceil(vv*1.05/aa);tm+=vv;tp+=p;}
      lines.push(x.kod+'  —  '+x.olcham+'  —  '+x.sirt+
        (p?'  —  '+String(vv).replace('.',',')+' m²  ('+p+' dona)':''));});
    document.getElementById('tot').innerHTML=tp
      ? 'Jami: <b>'+tp+' dona</b> · '+tm.toFixed(2).replace('.',',')+' m² xona' : '';
    document.getElementById('out').value=BRANDN+'\n'+lines.length+
      " ta mahsulot\n\n"+lines.join('\n')+
      (tp?'\n\nJami: '+tp+' dona · '+tm.toFixed(2).replace('.',',')+' m²':'');
  }});
document.getElementById('clr').onclick=()=>{SEL.clear();QTY={};saveSel();paintSel();
  grid.querySelectorAll('.star.on').forEach(e=>e.classList.remove('on'));
  closePanel();};
document.getElementById('copy').onclick=async()=>{
  const t=document.getElementById('out'),b=document.getElementById('copy');
  try{await navigator.clipboard.writeText(t.value);b.textContent='Nusxalandi';}
  catch(e){t.style.display='block';t.select();b.textContent="Qo'lda nusxalang";}
  setTimeout(()=>b.textContent="Ro'yxatni nusxalash",1700);};

/* ── hisoblagich ── */
function tileArea(s){
  const m=String(s).match(/(\d+)\s*[×x]\s*(\d+)/);
  if(!m)return null;
  let a=+m[1],b=+m[2];
  if(a<10){a*=1000;b*=1000;}            // "1×1 m"
  else if(a<100){a*=10;b*=10;}          // sm
  return (a/1000)*(b/1000);
}
function nf(x,d){return x.toFixed(d).replace('.',',');}
function calcHTML(d){
  const a=tileArea(d.olcham);
  if(!a)return '';
  const N=id=>'<div><label>'+id[1]+'</label><input id="'+id[0]+'" type="number" min="0" '+
    'step="0.1" inputmode="decimal" value="'+id[2]+'"></div>';
  return '<div class="calc"><h4>XONA HISOBLAGICHI</h4>'+
    '<div class="dims">'+N(['cU','Uzunlik, m','5'])+N(['cK','Kenglik, m','3'])+
      N(['cB','Balandlik, m','2.7'])+N(['cE','Eshik, dona','1'])+N(['cD','Deraza, dona','1'])+
    '</div>'+
    '<div class="opts">'+
      '<label><input type="checkbox" id="oP" checked> Pol</label>'+
      '<label><input type="checkbox" id="oW1" checked> Devor 1</label>'+
      '<label><input type="checkbox" id="oW2" checked> Devor 2</label>'+
      '<label><input type="checkbox" id="oW3" checked> Devor 3</label>'+
      '<label><input type="checkbox" id="oW4" checked> Devor 4</label>'+
    '</div>'+
    '<table id="ctab"></table>'+
    '<div class="note" id="cnote"></div>'+
    '<button class="add" id="cadd">Tanlanganlarga qo\'shish</button></div>';
}
function computeCalc(d){
  const a=tileArea(d.olcham);
  const v=id=>parseFloat((document.getElementById(id)||{}).value)||0;
  const ck=id=>(document.getElementById(id)||{}).checked;
  const U=v('cU'),K=v('cK'),B=v('cB'),E=v('cE'),Dr=v('cD');
  // zaxira: yirik plitada kesim ko'p, devorda burchak va o'yiqlar ko'p
  const big=a>=0.9;
  const rPol=big?0.10:0.07, rDev=big?0.13:0.10;
  const ochiq=E*1.8+Dr*2.1;                 // eshik 2,0×0,9 · deraza 1,5×1,4
  const rows=[];
  if(ck('oP')&&U&&K) rows.push(['Pol',U*K,rPol,U+'×'+K]);
  const walls=[['Devor 1',U],['Devor 2',K],['Devor 3',U],['Devor 4',K]];
  let wsum=0;
  walls.forEach((w,i)=>{ if(ck('oW'+(i+1))&&w[1]&&B){wsum+=w[1]*B;
    rows.push([w[0],w[1]*B,rDev,w[1]+'×'+B]);} });
  if(ochiq>0&&wsum>0){
    const cut=Math.min(ochiq,wsum*0.6);
    rows.push(['Eshik va deraza',-cut,rDev,'ayiriladi']);
  }
  let tm=0,tp=0;
  const tr=rows.map(r=>{
    const m=r[1], p=m>0?Math.ceil(m*(1+r[2])/a):Math.floor(m*(1+r[2])/a);
    tm+=m; tp+=p;
    return '<tr><td>'+r[0]+'<span style="color:var(--soft)"> · '+r[3]+'</span></td>'+
      '<td class="n" style="color:var(--soft)">'+nf(m,2)+' m²</td>'+
      '<td class="p">'+p+' dona</td></tr>';
  }).join('');
  return {html:tr, tm:tm, tp:tp, a:a, rPol:rPol, rDev:rDev, big:big};
}
function bindCalc(d){
  const box=document.getElementById('ctab');
  if(!box)return;
  const upd=()=>{
    const r=computeCalc(d);
    box.innerHTML=r.html+'<tr class="tot"><td>Jami</td><td class="n">'+nf(r.tm,2)+
      ' m²</td><td class="p">'+Math.max(0,r.tp)+' dona</td></tr>';
    document.getElementById('cnote').innerHTML=
      'Zaxira: pol '+Math.round(r.rPol*100)+'%, devor '+Math.round(r.rDev*100)+'% — '+
      (r.big?'yirik plita, kesim ko\'p chiqadi':'o\'rtacha o\'lcham')+'.<br>'+
      'Bitta plita '+nf(r.a,3)+' m². Eshik 2,0×0,9 m, deraza 1,5×1,4 m deb olindi.';
    CALC[d.id]=Math.max(0,r.tm);
  };
  ['cU','cK','cB','cE','cD'].forEach(i=>{const el=document.getElementById(i);
    if(el)el.oninput=upd;});
  ['oP','oW1','oW2','oW3','oW4'].forEach(i=>{const el=document.getElementById(i);
    if(el)el.onchange=upd;});
  const ad=document.getElementById('cadd');
  if(ad)ad.onclick=()=>{
    SEL.add(d.id); QTY[d.id]=String(Math.round((CALC[d.id]||0)*100)/100);
    saveSel(); paintSel(); render();
    ad.textContent='Qo\'shildi'; ad.classList.add('done');
    setTimeout(()=>{ad.textContent='Tanlanganlarga qo\'shish';ad.classList.remove('done');},1800);
  };
  upd();
}

function fromHash(){
  const h=decodeURIComponent((location.hash||'').replace('#',''));
  if(!h){if(det.classList.contains('on'))close_(true);return;}
  const d=D.find(x=>x.kod===h);
  if(d)open_(d.id,true);
}

document.getElementById('fcnt').textContent=D.length+" ta mahsulot";
/* ── telefonga o'rnatish ── */
(function(){
  const box=document.getElementById('inst'),txt=document.getElementById('insttxt'),
        go=document.getElementById('instgo'),x=document.getElementById('instx');
  const standalone = matchMedia('(display-mode: standalone)').matches ||
                     navigator.standalone === true;
  let dismissed=false;
  try{dismissed=localStorage.getItem('memor_inst')==='1';}catch(e){}
  if(standalone||dismissed) return;
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
  const file = location.protocol === 'file:';
  let deferred=null;
  function open_box(html,btn){
    txt.innerHTML=html;
    go.style.display=btn?'':'none';
    box.classList.add('on');
    setTimeout(()=>box.classList.add('vis'),60);
  }
  x.onclick=()=>{box.classList.remove('vis');
    setTimeout(()=>box.classList.remove('on'),400);
    try{localStorage.setItem('memor_inst','1');}catch(e){}};
  addEventListener('beforeinstallprompt',e=>{
    e.preventDefault(); deferred=e;
    open_box("<b>Katalogni telefonga o'rnating</b><br>Ilova kabi ochiladi, "+
             "internet kerak bo'lmaydi.", true);
  });
  go.onclick=async()=>{
    if(!deferred)return;
    deferred.prompt(); await deferred.userChoice; deferred=null;
    box.classList.remove('vis'); setTimeout(()=>box.classList.remove('on'),400);
  };
  if(ios && !file){
    setTimeout(()=>open_box("<b>Bosh ekranga qo'shish</b><br>Pastdagi "+
      "<b>Ulashish</b> belgisini bosing, so'ng <b>“Add to Home Screen”</b>ni tanlang.",
      false), 2600);
  }
})();
